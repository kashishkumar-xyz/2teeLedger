[package]
name = "ledger_lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
rusqlite = { version = "0.30.0", features = ["bundled-sqlcipher"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.6", features = ["derive"] }
base64 = "0.21"
hmac = "0.12"
sha2 = "0.10"
clap = { version = "4.4.18", features = ["derive"] }
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.8.1"
assert_cmd = "2.0"
predicates = "3.0"
serde_json = "1.0"

[[test]]
name = "ledger_integration_test"
path = "../tests/integration/ledger_integration_test.rs"

[[test]]
name = "backup_test"
path = "../tests/unit/backup_test.rs"

[[test]]
name = "db_test"
path = "../tests/unit/db_test.rs"

[[test]]
name = "ffi_test"
path = "../tests/unit/ffi_test.rs"

[[test]]
name = "key_management_test"
path = "../tests/unit/key_management_test.rs"

[[test]]
name = "models_test"
path = "../tests/unit/models_test.rs"

[[test]]
name = "recovery_test"
path = "../tests/unit/recovery_test.rs"

[[test]]
name = "list_performance_test"
path = "../tests/performance/list_performance_test.rs"
