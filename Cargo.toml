[package]
name = "ledger"
version = "0.1.0"
edition = "2021"

[lib]
name = "ledger"
crate-type = ["cdylib"]

[dependencies]
rusqlite = { version = "0.30.0", features = ["sqlcipher"] }
jni = "0.21.1"
zeroize = "1.7.0"
base64 = "0.21.7"
hmac = "0.12.1"
sha2 = "0.10.8"
clap = { version = "4.4.18", features = ["derive"] }
rand = "0.8.5"
