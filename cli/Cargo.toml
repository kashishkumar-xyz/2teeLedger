[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[dependencies]
ledger_lib = { path = "../ledger" }
clap = { version = "4.4.18", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8.1"
rusqlite = { version = "0.30.0", features = ["sqlcipher"] }

[[test]]
name = "cli_test"
path = "../tests/integration/cli_test.rs"

